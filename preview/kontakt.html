<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kontakt — Capshot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/capshot.css">
  </head>
  <body>
    <div class="announcement" data-i18n-en="Free shipping in Germany">Versandkostenfrei in Deutschland</div>
    <header class="site-header">
      <div class="page-width header-inner">
        <button class="icon-btn menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="MobileNav">
          <span class="visually-hidden" data-i18n-en="Menu">Menü</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <a class="logo" href="index.html"><img src="../assets/capshot-mark.png" alt="Capshot" width="260" height="155"></a>
        <nav class="nav" aria-label="Capshot">
          <a href="index.html">Home</a>
          <a href="capshot.html">Shop</a>
          <a href="regeln.html" data-i18n-en="Rules">Regeln</a>
          <a href="kontakt.html" data-i18n-en="Contact">Kontakt</a>
          <a href="community.html">Community</a>
        </nav>
        <div class="header-actions">
          <div class="shop-settings" data-shop-settings>
            <button type="button" class="shop-settings__toggle" data-panel-toggle aria-expanded="false" aria-controls="ShopSettings">
              <img data-locale-flag src="https://cdn.shopify.com/static/images/flags/de.svg" alt="" width="22" height="16">
              <span data-locale-code>DE</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.3 8.3a1 1 0 0 1 1.4 0L12 12.6l4.3-4.3a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 0 1 0-1.4Z"></path></svg>
              <span class="visually-hidden" data-i18n-en="Language">Sprache</span>
            </button>
            <div class="shop-settings__panel" id="ShopSettings" hidden>
              <button type="button" class="shop-settings__lang is-active" data-set-lang="de">
                <img src="https://cdn.shopify.com/static/images/flags/de.svg" alt="" width="22" height="16">
                Deutsch
              </button>
              <button type="button" class="shop-settings__lang" data-set-lang="en">
                <img src="https://cdn.shopify.com/static/images/flags/gb.svg" alt="" width="22" height="16">
                English
              </button>
            </div>
          </div>

          <button class="icon-btn" type="button" data-cart-open aria-controls="CartDrawer" aria-expanded="false">
            <span class="visually-hidden" data-i18n-en="Cart">Warenkorb</span>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"></path><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle><path d="M6 6 5 3H2"></path></svg>
            <span class="cart-count">1</span>
          </button>
        </div>
      </div>
      <nav id="MobileNav" class="menu-panel page-width" data-menu-panel>
        <a href="index.html">Home</a>
        <a href="capshot.html">Shop</a>
          <a href="regeln.html" data-i18n-en="Rules">Regeln</a>
        <a href="kontakt.html" data-i18n-en="Contact">Kontakt</a>
        <a href="community.html">Community</a>
      </nav>
    </header>
    <main id="MainContent">
      <section class="section">
        <div class="page-width">
          <div class="page-hero">
            <h1 data-i18n-en="Contact">Kontakt</h1>
            <p class="lede" data-i18n-en="Questions about the mat, your order or shipping? Write to us.">Fragen zur Matte, zur Bestellung oder zum Versand? Schreib uns.</p>
          </div>
          <form action="#" method="post">
            <div class="field"><label for="ContactName" data-i18n-en="Name">Name</label><input id="ContactName" type="text" required></div>
            <div class="field"><label for="ContactEmail" data-i18n-en="Email">E-Mail</label><input id="ContactEmail" type="email" required></div>
            <div class="field"><label for="ContactBody" data-i18n-en="Message">Nachricht</label><textarea id="ContactBody" rows="6" required></textarea></div>
            <button class="btn btn--primary" type="submit" data-i18n-en="Send">Absenden</button>
          </form>
        </div>
      </section>
    </main>
    <div class="cart-drawer" id="CartDrawer" data-cart-drawer hidden>
      <div class="cart-drawer__backdrop" data-cart-close tabindex="-1" aria-hidden="true"></div>
      <aside class="cart-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="CartDrawerTitle" tabindex="-1">
        <header class="cart-drawer__head">
          <h2 id="CartDrawerTitle">Warenkorb</h2>
          <button class="icon-btn cart-drawer__close" type="button" data-cart-close><span class="visually-hidden">Schließen</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </header>
        <div class="cart-drawer__body">
          <div class="cart-line">
            <img src="../assets/capshot-packshot.png" alt="Capshot Matte" width="80" height="80">
            <div><a href="capshot.html#buy">Capshot — Die Bierschnipsen-Matte</a><p>Menge 1</p></div>
            <div>24,90 €</div>
          </div>
        </div>
        <footer class="cart-drawer__foot">
          <p>Zwischensumme: 24,90 €</p>
          <a class="btn btn--primary btn--full" href="capshot.html#buy">Zur Kasse</a>
        </footer>
      </aside>
    </div>
    <script src="../assets/capshot.js"></script>
  </body>
</html>
