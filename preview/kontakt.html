<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kontakt — Capshot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/capshot.css">
  </head>
  <body>
    <div class="announcement">Versandkostenfrei in Deutschland</div>
    <header class="site-header">
      <div class="page-width header-inner">
        <a class="logo" href="index.html"><img src="../assets/capshot-mark.png" alt="Capshot" width="260" height="155"></a>
        <nav class="nav"><a href="index.html">Home</a><a href="regeln.html">Regeln</a><a href="kontakt.html">Kontakt</a></nav>
        <a class="icon-btn" href="cart.html"><span class="visually-hidden">Warenkorb</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"></path></svg></a>
      </div>
    </header>
    <main id="MainContent">
      <section class="section">
        <div class="page-width">
          <div class="page-hero">
            <h1>Kontakt</h1>
            <p class="lede">Fragen zur Matte, zur Bestellung oder zum Versand? Schreib uns.</p>
          </div>
          <form action="#" method="post">
            <div class="field"><label for="ContactName">Name</label><input id="ContactName" type="text" required></div>
            <div class="field"><label for="ContactEmail">E-Mail</label><input id="ContactEmail" type="email" required></div>
            <div class="field"><label for="ContactBody">Nachricht</label><textarea id="ContactBody" rows="6" required></textarea></div>
            <button class="btn btn--primary" type="submit">Absenden</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
